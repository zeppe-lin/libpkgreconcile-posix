name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC shared
            cc: gcc
            cxx: g++
            compiler: g++
            default_library: shared
            mode: shared
            man_pages: enabled
          - name: GCC static
            cc: gcc
            cxx: g++
            compiler: g++
            default_library: static
            mode: static
            man_pages: disabled
          - name: Clang shared
            cc: clang
            cxx: clang++
            compiler: clang++
            default_library: shared
            mode: shared
            man_pages: disabled
          - name: Clang static
            cc: clang
            cxx: clang++
            compiler: clang++
            default_library: static
            mode: static
            man_pages: disabled
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out libpkgreconcile-posix
        uses: actions/checkout@v4

      - name: Check out libpkgreconcile 0.3.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgreconcile
          ref: v0.3.0
          path: dependencies/libpkgreconcile

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            clang \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3-venv \
            scdoc
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: Configure, build, and test
        run: |
          ./ci/configure-and-test.sh \
            build \
            "${{ matrix.mode }}" \
            dependencies/libpkgreconcile \
            -Dman_pages="${{ matrix.man_pages }}"

      - name: Qualify installed product
        run: ./ci/qualify-installed.sh build "${{ matrix.mode }}"

  sanitizers:
    name: ${{ matrix.name }} address,undefined
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - name: Check out libpkgreconcile-posix
        uses: actions/checkout@v4

      - name: Check out libpkgreconcile 0.3.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgreconcile
          ref: v0.3.0
          path: dependencies/libpkgreconcile

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang libssl-dev ninja-build pkg-config python3-venv
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: Configure, build, and test
        run: |
          ./ci/configure-and-test.sh \
            build-sanitize \
            shared \
            dependencies/libpkgreconcile \
            -Dman_pages=disabled \
            -Db_sanitize=address,undefined \
            -Db_lundef=false

  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out libpkgreconcile-posix
        uses: actions/checkout@v4

      - name: Check out libpkgreconcile 0.3.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgreconcile
          ref: v0.3.0
          path: dependencies/libpkgreconcile

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            doxygen g++ libssl-dev ninja-build pkg-config python3-venv scdoc
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: Build manuals
        run: |
          ./ci/configure-and-test.sh \
            build-docs \
            shared \
            dependencies/libpkgreconcile \
            -Dman_pages=enabled

      - name: Validate Doxygen
        run: doxygen Doxyfile
